name: curl-macOS

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macOS:
    name: curl-macOS-Intel-Broadwell

    runs-on: macos-26

    permissions:
      contents: write

    steps:
      - name: Disable macOS Spotlight indexing
        run: |
          set -euxo pipefail

          sudo mdutil -a -i off
          sudo mdutil -a -d
          sudo pmset -a powernap 0
          sudo pmset -a sleep 0

      - name: Checkout
        uses: actions/checkout@v7

      - name: Show build environment
        run: |
          set -euxo pipefail

          echo
          echo "===== System ====="
          uname -a
          uname -m
          sw_vers

          echo
          echo "===== CPU ====="
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu

          echo
          echo "===== Toolchain ====="
          clang --version
          clang++ --version
          make --version
          cmake --version
          xcode-select -p

      - name: Detect latest curl release
        id: curl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          tag="$(
            /usr/bin/curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "User-Agent: ${GITHUB_REPOSITORY}" \
              "https://api.github.com/repos/curl/curl/releases/latest" |
              jq -r '.tag_name'
          )"

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Failed to determine latest curl release"
            exit 1
          fi

          echo "Latest curl release: ${tag}"

          case "$tag" in
            curl-[0-9]*)
              version="${tag#curl-}"
              version="${version//_/.}"
              ;;
            v[0-9]*)
              version="${tag#v}"
              ;;
            [0-9]*)
              version="$tag"
              ;;
            *)
              echo "ERROR: unexpected curl release tag: $tag"
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid curl version: $version"
            exit 1
          fi

          echo
          echo "Latest curl tag:     $tag"
          echo "Latest curl version: $version"
          echo

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "CURL_VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout static-curl
        uses: actions/checkout@v7
        with:
          repository: stunnel/static-curl
          path: static-curl
          fetch-depth: 1

      - name: Patch static-curl
        working-directory: static-curl
        env:
          CURL_VERSION: ${{ steps.curl.outputs.version }}
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("curl-static-mac.sh")
          text = path.read_text()

          def replace(old, new, description, occurrences=1):
              global text

              found = text.count(old)
              if found < occurrences:
                  raise SystemExit(
                      f"ERROR: {description} found {found} time(s), "
                      f"expected at least {occurrences}; "
                      "curl-static-mac.sh may have changed upstream"
                  )

              text = text.replace(old, new, occurrences)
              print(f"patched: {description}")

          def insert_before(marker, insertion, description):
              global text

              if marker not in text:
                  raise SystemExit(
                      f"ERROR: {description} marker not found; "
                      "curl-static-mac.sh may have changed upstream"
                  )

              text = text.replace(marker, insertion + marker, 1)
              print(f"patched: {description}")

          # Preserve existing linker flags when adding Apple frameworks.
          replace(
              '    export LDFLAGS="-framework CoreFoundation -framework SystemConfiguration"',
              '    export LDFLAGS="-framework CoreFoundation -framework SystemConfiguration ${LDFLAGS:-}"',
              "Apple framework linker flags",
          )

          # Apple Fast UDP.
          replace(
              '        --with-nghttp2 --with-nghttp3 --with-ngtcp2 \\\n'
              '        --with-libidn2 --with-libssh2 \\',
              '        --with-nghttp2 --with-nghttp3 --with-ngtcp2 \\\n'
              '        --enable-apple-fast-udp \\\n'
              '        --with-libidn2 --with-libssh2 \\',
              "Apple Fast UDP",
          )

          # Preserve global compiler optimization flags during curl configure.
          replace(
              '        CFLAGS="-I${PREFIX}/include" \\\n'
              '        CPPFLAGS="-I${PREFIX}/include";',
              '        CFLAGS="${CFLAGS} -I${PREFIX}/include" \\\n'
              '        CXXFLAGS="${CXXFLAGS}" \\\n'
              '        CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include";',
              "curl configure compiler flags",
          )

          # Preserve global optimization flags during curl compilation.
          replace(
              '    LDFLAGS="-L${PREFIX}/lib -static -all-static -Wl,-s ${LDFLAGS}" \\\n'
              '        CFLAGS="-I${PREFIX}/include -I${PREFIX}/include/brotli" \\\n'
              '        CPPFLAGS="-I${PREFIX}/include -I${PREFIX}/include/brotli" \\\n'
              '        make -j "${CPU_CORES}";',
              '    LDFLAGS="-L${PREFIX}/lib -static -all-static -Wl,-s ${LDFLAGS}" \\\n'
              '        CFLAGS="${CFLAGS} -I${PREFIX}/include -I${PREFIX}/include/brotli" \\\n'
              '        CXXFLAGS="${CXXFLAGS}" \\\n'
              '        CPPFLAGS="${CPPFLAGS} -I${PREFIX}/include -I${PREFIX}/include/brotli" \\\n'
              '        make -j "${CPU_CORES}";',
              "curl compilation compiler flags",
          )

          # Do not replace the global CFLAGS with hard-coded -O3.
          replace(
              '    LDFLAGS="-L${PREFIX}/lib ${LDFLAGS}" CFLAGS="-O3" \\\n',
              '    LDFLAGS="-L${PREFIX}/lib ${LDFLAGS}" \\\n'
              '        CFLAGS="${CFLAGS}" \\\n'
              '        CXXFLAGS="${CXXFLAGS}" \\\n',
              "libssh2 compiler flags",
          )

          # Disable OpenSSL tests/fuzz targets.
          replace(
              '        threads no-shared \\\n'
              '        enable-ktls \\',
              '        threads no-shared \\\n'
              '        no-tests \\\n'
              '        enable-ktls \\',
              "OpenSSL test/fuzz removal",
          )

          # Authenticate both GitHub API functions.
          #
          # The script uses:
          #
          #   -H "Authorization: ${auth_header}"
          #
          # Therefore auth_header must be:
          #
          #   Bearer <token>
          #
          # NOT:
          #
          #   Authorization: Bearer <token>
          #
          replace(
              '''    if [ -n "${TOKEN_READ:-}" ]; then
                  auth_header="token ${TOKEN_READ}"
              fi''',
              '''    if [ -n "${GH_TOKEN:-}" ]; then
                  auth_header="Bearer ${GH_TOKEN}"
              elif [ -n "${TOKEN_READ:-}" ]; then
                  auth_header="token ${TOKEN_READ}"
              fi''',
              "GitHub API authentication",
              occurrences=2,
          )

          replace(
                  '    curl_config;\n'
                  '    LDFLAGS="-L${PREFIX}/lib -static -all-static -Wl,-s ${LDFLAGS}" \\',
                  '    curl_config;\n\n'
                  '    # Autotools configure requires tests/Makefile.in.\n'
                  '    # Remove the complete curl test suite only after configure succeeds.\n'
                  '    rm -rf tests\n\n'
                  '    LDFLAGS="-L${PREFIX}/lib -static -all-static -Wl,-s ${LDFLAGS}" \\',
                  "curl test suite removal",
              )

          path.write_text(text)
          PY

          echo
          echo "===== Patched static-curl ====="
          echo

          git diff -- curl-static-mac.sh

          echo
          echo "===== Apple Fast UDP ====="
          grep -n -- '--enable-apple-fast-udp' curl-static-mac.sh

          echo
          echo "===== OpenSSL no-tests ====="
          grep -n -A2 -B2 -- 'no-tests' curl-static-mac.sh

          echo
          echo "===== Curl tests removal ====="
          grep -n -A2 -B2 -- 'rm -rf tests' curl-static-mac.sh

          echo
          echo "===== GitHub authentication ====="
          grep -n -A8 -B2 -- 'auth_header' curl-static-mac.sh

      - name: Configure optimized Intel build
        run: |
          set -euxo pipefail

          export MACOSX_DEPLOYMENT_TARGET=11.0

          CFLAGS="-O3 -march=broadwell -mtune=broadwell -flto=thin -ffunction-sections -fdata-sections -fomit-frame-pointer -fno-unwind-tables -fno-asynchronous-unwind-tables -pipe"

          CXXFLAGS="$CFLAGS"

          LDFLAGS="-Wl,-dead_strip -Wl,-dead_strip_dylibs"

          export CFLAGS
          export CXXFLAGS
          export LDFLAGS

          {
              echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"
              echo "CFLAGS=$CFLAGS"
              echo "CXXFLAGS=$CXXFLAGS"
              echo "LDFLAGS=$LDFLAGS"
          } >> "$GITHUB_ENV"

          echo
          echo "===== CFLAGS ====="
          echo "$CFLAGS"

          echo
          echo "===== CXXFLAGS ====="
          echo "$CXXFLAGS"

          echo
          echo "===== LDFLAGS ====="
          echo "$LDFLAGS"

      - name: Build static curl
        working-directory: static-curl
        env:
          ARCHES: x86_64
          TLS_LIB: openssl
          CURL_VERSION: ${{ steps.curl.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Leave dependencies on their current release-resolution mechanism.
          OPENSSL_VERSION: ""
          NGTCP2_VERSION: ""
          NGHTTP3_VERSION: ""
          NGHTTP2_VERSION: ""
          LIBIDN2_VERSION: ""
          LIBUNISTRING_VERSION: ""
          ZLIB_VERSION: ""
          BROTLI_VERSION: ""
          ZSTD_VERSION: ""
          LIBSSH2_VERSION: ""
          LIBPSL_VERSION: ""
          ARES_VERSION: ""

          ENABLE_DEBUG: false

        run: |
          set -euxo pipefail
          bash ./curl-static-mac.sh

      - name: Rename release assets
        id: assets
        working-directory: static-curl
        env:
          CURL_VERSION: ${{ steps.curl.outputs.version }}
        run: |
          set -euxo pipefail

          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          mkdir -p "$RELEASE_DIR"
          VERSION="$CURL_VERSION"

          BIN="$RELEASE_DIR/bin/curl-macos-x86_64"
          DEV="$RELEASE_DIR/curl-macos-x86_64-dev-${VERSION}.tar.xz"
          CA="$RELEASE_DIR/cacert.pem"

          FINAL_BIN="$RELEASE_DIR/curl-${VERSION}-macos-x86_64-broadwell"
          FINAL_DEV="$RELEASE_DIR/curl-${VERSION}-macos-x86_64-broadwell-dev.tar.xz"
          FINAL_CA="$RELEASE_DIR/curl-${VERSION}-cacert.pem"

          mv "$BIN" "$FINAL_BIN"
          mv "$DEV" "$FINAL_DEV"
          mv "$CA" "$FINAL_CA"

          echo "binary=$FINAL_BIN" >> "$GITHUB_OUTPUT"
          echo "dev=$FINAL_DEV" >> "$GITHUB_OUTPUT"
          echo "cacert=$FINAL_CA" >> "$GITHUB_OUTPUT"

          echo
          echo "===== Final assets ====="

          ls -lh \
            "$FINAL_BIN" \
            "$FINAL_DEV" \
            "$FINAL_CA"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: curl-${{ steps.curl.outputs.version }}-macos-x86_64-broadwell
          path: |
            release/curl-${{ steps.curl.outputs.version }}-macos-x86_64-broadwell
            release/curl-${{ steps.curl.outputs.version }}-macos-x86_64-broadwell-dev.tar.xz
            release/curl-${{ steps.curl.outputs.version }}-cacert.pem

      - name: Upload to GitHub Release
        working-directory: static-curl
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.curl.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail

          RELEASE_TAG="curl-${VERSION}"

          BIN="$GITHUB_WORKSPACE/release/curl-${VERSION}-macos-x86_64-broadwell"
          DEV="$GITHUB_WORKSPACE/release/curl-${VERSION}-macos-x86_64-broadwell-dev.tar.xz"
          CA="$GITHUB_WORKSPACE/release/curl-${VERSION}-cacert.pem"

          echo
          echo "===== GitHub Release ====="
          echo "Repository: $REPOSITORY"
          echo "Version:    $VERSION"
          echo "Tag:        $RELEASE_TAG"
          echo

          if gh release view \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            >/dev/null 2>&1
          then
            echo "Release already exists; replacing assets."

            gh release upload \
              "$RELEASE_TAG" \
              "$BIN" \
              "$DEV" \
              "$CA" \
              --repo "$REPOSITORY" \
              --clobber
          else
            echo "Creating release."

            gh release create \
              "$RELEASE_TAG" \
              "$BIN" \
              "$DEV" \
              "$CA" \
              --repo "$REPOSITORY" \
              --title "curl ${VERSION} — macOS x86_64 Broadwell" \
              --generate-notes
          fi

          echo
          echo "===== Release ====="

          gh release view \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY"
